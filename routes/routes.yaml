- id: datax
  name_zh: 技能数据扩展与部署
  name_en: Skill Data Scaling & Deployment
  description: 用少量技能示范生成大规模训练数据：结构保持的变换与重定向、几何物理筛选、模仿学习/VLA 与 sim-to-real。
  pipeline: 少量技能示范 → 结构保持变换/重定向 → 几何与物理筛选 → 大规模轨迹 → 模仿学习/VLA → sim-to-real
  insight: 数据扩展通常扩大的是一个已识别技能的有效域，而不是发现一个全新的技能。
  related_nodes:
  - robotics.manip
  - robotics.sim
  stages:
  - name: 位姿变换与重定向
    description: 基于对象位姿的 SE(3) 轨迹变换；free-space 与 contact-rich 片段分离； 双臂 Parallel/Coordination/Sequential 部分有序关系。
    items:
    - label: SkillMimicGen
      note: 技能级示范变换生成数据
      key: true
    - label: DexMimicGen
      note: 双臂灵巧操作数据自动生成
    - label: DemoGen
      note: 泛化数据源的示范扩展
  - name: 大规模生成与世界模型
    description: 程序化 expert 轨迹、视频世界模型与 pseudo-action、domain randomization、仿真成功判据过滤。
    items:
    - label: DexScale
      note: 灵巧操作规模化数据
    - label: DreamGen
      note: 视频世界模型 + pseudo-action 生成动作标签
  - name: Affordance 条件生成
    description: affordance-conditioned grasp 与交互区域引导数据生成。
    items:
    - label: AffordGen
      note: affordance 驱动交互数据生成
    - label: AffordSim
      note: affordance 仿真验证
    - label: MolmoB0T
      note: affordance 引导的操作数据管线
  edges:
  - from: SkillMimicGen
    to: DexMimicGen
    relation: evolve
    label: 单臂技能级 → 双臂灵巧
  - from: DexMimicGen
    to: DemoGen
    relation: evolve
    label: 专用变换 → 泛化数据源
  - from: AffordGen
    to: AffordSim
    relation: enable
    label: affordance 生成 → 仿真可行性验证
- id: compose
  name_zh: 组合、运行时、验证与技能治理
  name_en: Composition, Runtime, Verification & Governance
  description: 从语义约束到几何 grounding，从技能连接到长程组合，再到编排监控、失败恢复与形式化契约治理。
  pipeline: 语义约束 → 几何 Grounding → 技能连接与长程组合 → 编排/监控/失败恢复 → 形式化契约与技能治理
  insight: 跨越这条路线后，技能不再是策略文件，而成为带契约的可治理资产——这是技能库长期演化的前提。
  related_nodes:
  - robotics.embodied
  - robotics.plan
  - robotics.control
  stages:
  - name: 从语义到几何
    description: 把语言/任务意图 grounding 为可优化的几何约束。
    items:
    - label: VoxPoser
      year: 2023
      full_title: 'VoxPoser: Composable 3D Value Maps for Robotic Manipulation with Language Models'
      note: 语言程序 → 3D value maps → MPC
      key: true
      url: https://arxiv.org/abs/2307.05973v2
    - label: ReKep
      year: 2024
      full_title: 'ReKep: Spatio-Temporal Reasoning of Relational Keypoint Constraints for Robotic Manipulation'
      note: 关系关键点约束 → 连续优化
      key: true
      url: https://arxiv.org/abs/2409.01652v2
    - label: CoPa
      note: 对象部件 → 几何关系约束
    - label: ShapeGrasp
      note: 任务效用 → 部件语义 → 抓取区域
    - label: VoxAfford / AffordSim
      note: 开放词汇 affordance → 3D mask → 可行性
  - name: 技能连接与长程组合
    description: 让离散技能可以连贯地串成长程行为。
    items:
    - label: FIST
      note: 技能间转移模型
    - label: LiSP
      note: 潜在技能计划与转移
    - label: Generative Skill Chaining
      note: 联合扩散式技能链生成
      key: true
    - label: SPIN
      note: Skill-RRT + connector + 噪声回放 + 蒸馏策略
    - label: SkillWrapper
      note: 执行数据 → predicate invention → 任务级规划
    - label: IALP
      note: 语言计划 + 物理 grounding
    - label: FLARE
      note: 语言条件技能接口与执行
    - label: CABTO
      note: 分支时序逻辑驱动的技能编排
  - name: 编排、监控与失败恢复
    description: planner–executor–verifier 闭环：异构策略编排、前后置条件检查、trace 驱动修复与持久运行时。
    items:
    - label: Agentic Robot
      note: planner–executor–verifier 架构
    - label: VoLo
      note: 异构策略工具编排与 handoff
    - label: Guava
      note: 策略即工具的编排框架
    - label: Unified Failure Handling
      note: 前后置条件检查 + 失败处理
    - label: BETR-XP-LLM
      note: 行为树扩展 + LLM 恢复
    - label: ASPIRE
      note: 执行 trace 定位失败并修复程序（同 guided 路线）
    - label: RHO
      note: trace 驱动的程序修复
    - label: HoloAgent-0
      note: 持久状态与能力模块运行时
    - label: AEROS
      note: 面向执行的技能运行时
  - name: 形式化契约与治理
    description: 用形式模型刻画技能的前置/后置/资源约束，支撑安全与可验证演化。
    items:
    - label: Skill Petri Net
      note: Petri 网建模技能组合与并发
    - label: VASO
      note: 形式化技能编排验证
    - label: Contract-Grounded BT
      note: 契约接地的行为树
    - label: ECM Contracts
      note: 环境能力模型契约
    - label: Knowledge-Based Adaptive BT
      note: 知识驱动的自适应行为树
  edges:
  - from: VoxPoser
    to: ReKep
    relation: evolve
    label: 3D value map → 关系关键点约束
  - from: ReKep
    to: CoPa
    relation: evolve
    label: 关键点 → 部件级几何关系
  - from: FIST
    to: Generative Skill Chaining
    relation: evolve
    label: 转移模型 → 联合扩散链
  - from: Generative Skill Chaining
    to: SPIN
    relation: evolve
    label: 链生成 → RRT 规划 + 蒸馏
  - from: SkillWrapper
    to: Skill Petri Net
    relation: enable
    label: predicate 发明 → 形式化建模
  - from: ASPIRE
    to: RHO
    relation: evolve
    label: 在线修复 → trace 驱动离线/在线修复
  - from: Unified Failure Handling
    to: Contract-Grounded BT
    relation: evolve
    label: 前后置检查 → 契约化行为树
